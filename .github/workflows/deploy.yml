name: Deploy na GitHub Pages

# Apka 2.0 publikuje się SAMA po każdym pushu na gałąź roboczą — zmiany
# zrobione przez Claude od razu lądują pod
# https://lauranowakkontakt-creator.github.io/Apka_2.0/
# Można też odpalić ręcznie: Actions → Deploy na GitHub Pages → Run workflow.
#
# Dopóki w .env.production nie ma danych NOWEGO projektu Firebase, build
# się wykonuje, ale publikacja jest pomijana (apka bez bazy byłaby pusta).
on:
  push:
    branches: ['claude/zealous-edison-yiudqj']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Jeden deploy naraz. Bez tego dwa równoległe przebiegi mogą nadpisać się
# nawzajem i na Pages ląduje starsza wersja.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      gotowe: ${{ steps.projekt.outputs.gotowe }}
    steps:
      - uses: actions/checkout@v4

      - name: Czy jest projekt Firebase?
        id: projekt
        run: |
          if node scripts/sprawdz-projekt.js; then
            echo "gotowe=tak" >> "$GITHUB_OUTPUT"
          else
            echo "gotowe=nie" >> "$GITHUB_OUTPUT"
            echo "::warning::Brak projektu Firebase w .env.production — publikacja pominięta."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Te same bramki co w CI — wdrożenie nie omija testów.
      - name: Testy przed wdrożeniem
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: steps.projekt.outputs.gotowe == 'tak'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.gotowe == 'tak'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
